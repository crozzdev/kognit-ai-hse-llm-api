name: ci

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main, feat/*]

jobs:
  quality-and-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.10.8"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: Cache uv
        uses: actions/cache@v4
        with:
          path: .uv-cache
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-

      - name: Minimize uv cache
        run: uv cache prune --ci
        env:
          UV_CACHE_DIR: .uv-cache

      - name: Check lockfile is in sync
        run: uv lock --check
        env:
          UV_CACHE_DIR: .uv-cache

      - name: Install project dependencies
        run: uv sync --locked --all-extras
        env:
          UV_CACHE_DIR: .uv-cache

      - name: Ruff
        run: uvx ruff@0.15.0 check .
        env:
          UV_CACHE_DIR: .uv-cache

      - name: Ty
        run: uvx ty@0.0.29 check
        env:
          UV_CACHE_DIR: .uv-cache

      - name: Pytest + coverage
        run: uv run --locked pytest --cov=. --cov-report=xml --cov-report=term-missing
        env:
          UV_CACHE_DIR: .uv-cache

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_QUBE_TOKEN}}