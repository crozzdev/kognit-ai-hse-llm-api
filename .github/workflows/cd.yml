name: cd


on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  FUNCTION_NAME: kognit-ai-hse-llm-api
  ALIAS_NAME: prod
  ZIP_NAME: kognit-ai-hse-llm-api.zip
  AWS_REGION: us-east-1

jobs:
  deploy-aws-lambda:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token:     ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.10.8"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: Cache uv
        uses: actions/cache@v4
        with:
          path: .uv-cache
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-

      - name: Minimize uv cache
        run: uv cache prune --ci
        env:
          UV_CACHE_DIR: .uv-cache

      - name: Build deployment package
        run: bash build.sh

      - name: Update Lambda code
        run: |
          aws lambda update-function-code \
            --function-name ${{ env.FUNCTION_NAME }} \
            --zip-file fileb://${{ env.ZIP_NAME }}

      - name: Wait for update to complete
        run: |
          aws lambda wait function-updated \
            --function-name ${{ env.FUNCTION_NAME }}

      - name: Publish new version
        id: publish
        run: |
          VERSION=$(aws lambda publish-version \
            --function-name ${{ env.FUNCTION_NAME }} \
            --query 'Version' --output text)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Published version $VERSION"

      - name: Integration test (health check)
        run: |
          aws lambda invoke \
            --function-name ${{ env.FUNCTION_NAME }}:${{ steps.publish.outputs.version }} \
            --payload file://tests/events/health-check.json \
            --cli-binary-format raw-in-base64-out \
            response.json

          cat response.json

          STATUS=$(python3 -c "
          import json; print(json.load(open('response.json')).get('statusCode', 0))
          ")

          [ "$STATUS" = "200" ] && echo "Health check passed" || \
          (echo "Health check failed — status $STATUS" && exit 1)



      - name: Promote prod alias
        run: |
          aws lambda update-alias \
            --function-name ${{ env.FUNCTION_NAME }} \
            --name ${{ env.ALIAS_NAME }} \
            --function-version ${{ steps.publish.outputs.version }}
          echo "Alias 'prod' → version ${{ steps.publish.outputs.version }}"