# Local development Docker Compose for the Kognit AI HSE LLM API (R15.9-R15.11, R15.30).
#
# Supplies every R15 configuration variable to the service as an environment
# variable with no inline secret (R15.9). KOGNIT_LLM_MODEL_PROVIDER is `stub` so
# both routes serve with no AWS reachability (R15.10). The optional PostgreSQL
# service is a local development fixture that holds no warehouse data and is
# excluded from CI and from every deployed environment (R15.30) — it is under the
# `fixtures` profile so it does not start by default.
services:
  llm-api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${KOGNIT_LLM_PORT:-8000}:${KOGNIT_LLM_PORT:-8000}"
    environment:
      # ── General ──────────────────────────────────────────────────────────
      KOGNIT_LLM_ENVIRONMENT: local
      KOGNIT_LLM_AWS_REGION: us-east-1
      KOGNIT_LLM_PORT: "8000"
      KOGNIT_LLM_LOG_LEVEL: INFO
      KOGNIT_LLM_CORS_ORIGINS: ""
      KOGNIT_LLM_EXPOSE_EXECUTED_SQL: "false"
      KOGNIT_LLM_SERVICE_VERSION: "0.1.0"
      # ── Message and answer shaping ───────────────────────────────────────
      KOGNIT_LLM_MESSAGE_MAX_CHARS: "2000"
      KOGNIT_LLM_ANSWER_MAX_CHARS: "600"
      KOGNIT_LLM_ANSWER_LANGUAGE: auto
      # ── Dates and intent ─────────────────────────────────────────────────
      KOGNIT_LLM_REFERENCE_TIMEZONE: America/Bogota
      KOGNIT_LLM_FIRST_DAY_OF_WEEK: MONDAY
      KOGNIT_LLM_DEFAULT_LOOKBACK_DAYS: "365"
      KOGNIT_LLM_INTENT_CONFIDENCE_THRESHOLD: "0.60"
      # ── Warehouse connection (local fixture; no secret inline) ───────────
      KOGNIT_LLM_DB_HOST: postgres
      KOGNIT_LLM_DB_PORT: "5432"
      KOGNIT_LLM_DB_NAME: kognit_dwh
      KOGNIT_LLM_DB_SCHEMA: public
      KOGNIT_LLM_DB_ROLE: llm_read
      KOGNIT_LLM_DB_SSLMODE: disable
      KOGNIT_LLM_DB_USER_PARAM: /kognit/db/LLM_READ_USER
      KOGNIT_LLM_DB_PASSWORD_PARAM: /kognit/db/LLM_READ_PASSWORD
      KOGNIT_LLM_DB_CONNECT_TIMEOUT_MS: "2000"
      KOGNIT_LLM_DB_STATEMENT_TIMEOUT_MS: "10000"
      KOGNIT_LLM_DB_POOL_MAX: "2"
      KOGNIT_LLM_DB_POOL_MIN: "1"
      # ── Result caps ──────────────────────────────────────────────────────
      KOGNIT_LLM_ROW_CAP: "1000"
      KOGNIT_LLM_MAX_RESULT_COLUMNS: "50"
      KOGNIT_LLM_MAX_RESULT_BYTES: "1048576"
      KOGNIT_LLM_MAX_RANKING_SIZE: "25"
      # ── Model provider (stub: no AWS reachability needed) ────────────────
      KOGNIT_LLM_MODEL_PROVIDER: stub
      KOGNIT_LLM_MODEL_TIMEOUT_MS: "15000"
      KOGNIT_LLM_MODEL_TEMPERATURE: "0.0"
      KOGNIT_LLM_MODEL_MAX_OUTPUT_TOKENS: "1024"
      KOGNIT_LLM_MODEL_MAX_RETRIES: "2"
      KOGNIT_LLM_MODEL_CALLS_PER_TURN_MAX: "4"
      KOGNIT_LLM_TURN_TOKEN_CEILING: "12000"
      KOGNIT_LLM_PROMPT_VERSION: v1
      # ── Turn budget ──────────────────────────────────────────────────────
      KOGNIT_LLM_TURN_TIMEOUT_MS: "25000"
      # ── Schema context ───────────────────────────────────────────────────
      KOGNIT_LLM_SCHEMA_CONTEXT_TOKEN_BUDGET: "4000"
      KOGNIT_LLM_INCLUDE_DIMENSION_VALUES: "true"
      KOGNIT_LLM_DIMENSION_VALUE_MAX: "50"
      KOGNIT_LLM_SCHEMA_CACHE_TTL_SECONDS: "3600"
      # ── SQL complexity bounds ────────────────────────────────────────────
      KOGNIT_LLM_MAX_STATEMENT_CHARS: "4000"
      KOGNIT_LLM_MAX_JOIN_COUNT: "8"
      KOGNIT_LLM_MAX_SUBQUERY_DEPTH: "3"
      KOGNIT_LLM_MAX_SET_OPERATION_ARMS: "3"
      KOGNIT_LLM_INLINE_GROUP_ROWS_MAX: "5"
      # ── Conversation store ───────────────────────────────────────────────
      KOGNIT_LLM_CONVERSATION_STORE: memory
      KOGNIT_LLM_CONVERSATION_TURN_MAX: "10"
      KOGNIT_LLM_CONVERSATION_MAX: "100"
      KOGNIT_LLM_CONVERSATION_TTL_SECONDS: "1800"
      KOGNIT_LLM_CONVERSATION_CHAR_BUDGET: "5000000"
      # ── Request limits ───────────────────────────────────────────────────
      KOGNIT_LLM_REQUEST_BODY_MAX_BYTES: "16384"
      KOGNIT_LLM_RATE_LIMIT_PER_MINUTE: "60"
      KOGNIT_LLM_CONCURRENT_REQUEST_MAX: "10"

  # Optional local warehouse fixture: holds no warehouse data, excluded from CI
  # and every deployed environment (R15.30). Start explicitly with:
  #   docker compose --profile fixtures up
  postgres:
    image: postgres:16-alpine
    profiles: ["fixtures"]
    environment:
      POSTGRES_DB: kognit_dwh
      POSTGRES_USER: llm_read
      # Local-only throwaway password for the empty fixture; never a real secret.
      POSTGRES_PASSWORD: local_dev_only
    ports:
      - "5432:5432"
